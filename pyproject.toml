[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "myagent"
version = "0.1.0"
description = "Modular personal agent runtime: agent loop, memory, RAG and context management"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyouko" }]
keywords = ["agent", "llm", "rag", "memory", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The runtime stays as small as possible: the framework core is rebuilt on the
# standard library, and every dependency must be justified by a decision record
# (see docs/development.md, "依赖管理").
dependencies = [
    "python-dotenv>=1.0", # ADR-0004: .env loading is the only secret entry point
    "openai>=1.50", # ADR-0006: one OpenAI-compatible client covers every Phase 2 provider
    "qdrant-client>=1.12", # ADR-0003/0008: the vector index behind myagent.memory.vector_index
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
myagent = "myagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myagent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown is excluded so that Python fences inside docs keep their original
# formatting (the plan document is not source code).
extend-exclude = [".venv", "nanobot", "*.md"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "W", # pycodestyle warnings
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ASYNC", # flake8-async
    "ANN", # flake8-annotations (type annotations are a project requirement)
]
# RUF001/002/003 flag full-width CJK punctuation as "ambiguous" Latin look-alikes.
# They are not ambiguous here: the write policy matches Chinese text (where 。！？；
# are the correct characters), and comments/docstrings quote the plan's Chinese.
# The non-obvious ones are pinned: keywords have Chinese comments in the code.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "ANN401"]
# The tool and provider boundaries are dynamic on purpose: tool arguments arrive
# as parsed JSON and provider payloads are SDK objects (PLAN 2.2 / 2.3). `Any` is
# contained to those edges; the rest of the framework stays strictly typed.
"src/myagent/tools/base.py" = ["ANN401"]
"src/myagent/tools/registry.py" = ["ANN401"]
"src/myagent/tools/builtin/*.py" = ["ANN401"]
"src/myagent/models/openai_compat.py" = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["myagent"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["myagent"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
    # Protocol / abstract method bodies ("...") never run.
    '^\s*\.\.\.\s*$',
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

# qdrant-client depends on numpy, whose 2.5 stubs use PEP 695 ``type`` statements
# that mypy cannot parse while targeting Python 3.11. numpy is a transitive
# dependency we never annotate against ourselves, so it is skipped rather than
# raising the whole project's target version.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
# ``follow_imports = "skip"`` alone still makes mypy *parse* a stub, and the
# numpy 2.5 stubs open with PEP 695 ``type`` aliases that mypy refuses while
# targeting 3.11. This flag ("respect skip for stubs too") is what keeps them
# out of the build entirely; numpy is a transitive dependency of qdrant-client
# that this project never annotates against itself.
follow_imports_for_stubs = true
